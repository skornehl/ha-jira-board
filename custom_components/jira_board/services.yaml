get_issue:
  name: Get issue details
  description: >-
    Fetch full details (description, assignee, reporter, priority, labels,
    dates) for a single Jira issue. Used internally by the board card's
    click-for-details popup; returns the data rather than firing an event
    or setting a state, so call it with "return_response".
  fields:
    issue_key:
      name: Issue key
      description: The Jira issue key to fetch, e.g. HA-42.
      required: true
      example: "HA-42"
      selector:
        text:
    board_entity_id:
      name: Board entity
      description: >-
        One of the board's todo.* column entities, so the right configured
        Jira site is used when more than one board is set up. Falls back to
        the only/first configured board if omitted.
      required: false
      selector:
        entity:
          domain: todo

update_issue:
  name: Update issue
  description: >-
    Overwrite an issue's summary and (optionally) description. Used
    internally by the board card's details popup edit mode.
  fields:
    issue_key:
      name: Issue key
      description: The Jira issue key to update, e.g. HA-42.
      required: true
      example: "HA-42"
      selector:
        text:
    board_entity_id:
      name: Board entity
      description: Same as get_issue's board_entity_id.
      required: false
      selector:
        entity:
          domain: todo
    summary:
      name: Summary
      description: The issue's new summary/title.
      required: true
      selector:
        text:
    description:
      name: Description
      description: >-
        The issue's new description (plain text). Omit entirely to leave
        the current description untouched; pass an empty string to clear
        it.
      required: false
      selector:
        text:
          multiline: true

add_comment:
  name: Add comment
  description: >-
    Post a plain-text comment on an issue. Used internally by the board
    card's details popup.
  fields:
    issue_key:
      name: Issue key
      description: The Jira issue key to comment on, e.g. HA-42.
      required: true
      example: "HA-42"
      selector:
        text:
    board_entity_id:
      name: Board entity
      description: Same as get_issue's board_entity_id.
      required: false
      selector:
        entity:
          domain: todo
    comment:
      name: Comment
      description: The comment text (plain text).
      required: true
      selector:
        text:
          multiline: true
