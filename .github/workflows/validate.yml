name: Validate

# Standard pair of checks for any HACS-published custom integration:
# hacs/action validates the repo structure/hacs.json against HACS' own
# requirements; hassfest validates manifest.json against the same schema
# Home Assistant Core runs against every integration, official or custom.
# Both are read-only checks against this repo - they never touch a live
# Home Assistant instance.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

# Both checks only read the repository.
permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@d556e736723344f83838d08488c983a15381059a # 22.5.0
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master 2026-10-28
