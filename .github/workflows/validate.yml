name: Validate

# Standard pair of checks for any HACS-published custom integration:
# hacs/action validates the repo structure/hacs.json against HACS' own
# requirements; hassfest validates manifest.json against the same schema
# Home Assistant Core runs against every integration, official or custom.
# Both are read-only checks against this repo - they never touch a live
# Home Assistant instance.
on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    name: Hassfest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest validation
        uses: home-assistant/actions/hassfest@master
